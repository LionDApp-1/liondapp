name = "liondapp-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
APP_ORIGIN = "http://localhost:8788"
ADMIN_ORIGIN = "http://localhost:8788"
ADMIN_PASSWORD_ORIGIN = "http://localhost:8788"
ENVIRONMENT = "devnet"
AUTH_CHAIN_ID = "solana:devnet"
RECOMMENDATION_DAYS = "7"
DEFAULT_RECOMMENDATION_PRICE = "10"
SKR_MINT = "SKRbvo6Gf7GondiT3BbTfuRDPqLWei4j2Qy2NPGZhW3"
RECEIVER_ADDRESS = "11111111111111111111111111111111"
SKR_DECIMALS = "6"
SESSION_TTL_SECONDS = "86400"
PAYMENT_MODE = "simulation"
DONATIONS_ENABLED = "false"
SOLANA_RPC_URL = "https://api.devnet.solana.com"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "liondapp-local"
database_id = "replace-with-your-d1-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "liondapp-media-local"
